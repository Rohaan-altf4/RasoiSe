<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen dashboard · RasoiSe</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="/js/tw-config.js"></script>
  <script src="/js/area.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body>
  <main id="main" class="page">
    <div class="container">
      <div id="kitchenStatus"></div>
      <div class="flex flex-wrap items-end justify-between gap-3" style="margin-bottom:var(--s4)">
        <div>
          <p class="label-caps" id="kitchenName" style="margin:0"></p>
          <h1 class="h1" id="pageTitle">Today</h1>
        </div>
        <div class="flex gap-2 no-print">
          <a class="btn btn-secondary btn-sm" href="/chef-settings.html#menu"><i data-lucide="utensils"></i>Edit menu</a>
          <button type="button" class="btn btn-secondary btn-sm" id="pauseBtn"></button>
        </div>
      </div>

      <div class="tabs no-print" role="tablist" aria-label="Dashboard sections" style="margin-bottom:var(--s5)">
        <a class="tab" role="tab" href="#today" data-tab="today">Today</a>
        <a class="tab" role="tab" href="#upcoming" data-tab="upcoming">Upcoming</a>
        <a class="tab" role="tab" href="#tickets" data-tab="tickets">Complaints <span class="count" id="ticketCount" hidden></span></a>
        <a class="tab" role="tab" href="#reviews" data-tab="reviews">Reviews</a>
        <a class="tab" role="tab" href="#earnings" data-tab="earnings">Earnings</a>
      </div>

      <section id="tab-today" data-panel="today"></section>
      <section id="tab-upcoming" data-panel="upcoming" hidden></section>
      <section id="tab-tickets" data-panel="tickets" hidden></section>
      <section id="tab-reviews" data-panel="reviews" hidden></section>
      <section id="tab-earnings" data-panel="earnings" hidden></section>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/maps.js"></script>
  <script src="/js/tickets.js"></script>
  <script src="/js/pages/chef-dashboard.js"></script>
</body>
</html>
