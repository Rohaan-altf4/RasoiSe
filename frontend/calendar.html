<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My meals · RasoiSe</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="/js/tw-config.js"></script>
  <script src="/js/area.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body>
  <main id="main" class="page">
    <div class="container">
      <div class="flex flex-wrap items-end justify-between gap-3" style="margin-bottom:var(--s5)">
        <div>
          <h1 class="h1">My meals</h1>
          <p class="text-muted" style="margin:6px 0 0">Tap a day to pick dishes, add extras, or skip. Changes close a set time before each meal (usually 24 hours).</p>
        </div>
        <div class="flex gap-2">
          <button type="button" class="btn btn-secondary" id="holidayBtn"><i data-lucide="palmtree"></i>Holiday mode</button>
          <a class="btn btn-primary" href="/index.html"><i data-lucide="plus"></i>Order a meal</a>
        </div>
      </div>

      <div id="alerts" style="display:grid;gap:10px;margin-bottom:var(--s5)"></div>

      <div class="grid grid-cols-1 gap-6 lg:grid-cols-[minmax(0,1fr)_340px]">
        <section class="card card-pad" aria-labelledby="calTitle" style="min-width:0">
          <div class="flex flex-wrap items-center justify-between gap-3" style="margin-bottom:14px">
            <div class="flex items-center gap-1">
              <button type="button" class="btn btn-ghost btn-icon btn-sm" id="prevBtn" aria-label="Previous"><i data-lucide="chevron-left"></i></button>
              <h2 class="title" id="calTitle" aria-live="polite" style="min-width:150px;text-align:center"></h2>
              <button type="button" class="btn btn-ghost btn-icon btn-sm" id="nextBtn" aria-label="Next"><i data-lucide="chevron-right"></i></button>
              <button type="button" class="btn btn-ghost btn-sm" id="todayBtn">Today</button>
            </div>
            <div class="segmented" role="group" aria-label="Calendar view" style="min-width:170px">
              <button type="button" id="monthBtn" aria-pressed="true">Month</button>
              <button type="button" id="weekBtn" aria-pressed="false">Week</button>
            </div>
          </div>
          <div id="calendar" aria-busy="true"></div>
          <div class="legend" style="margin-top:14px">
            <span><i class="st-scheduled" style="background:var(--success)"></i>Scheduled</span>
            <span><i style="background:var(--info)"></i>On the way</span>
            <span><i style="background:#B9A493"></i>Delivered</span>
            <span><i style="background:#E0A040"></i>Skipped</span>
            <span><i style="background:#8C68AE"></i>Chef holiday</span>
            <span><i style="background:var(--danger)"></i>Cancelled</span>
          </div>
        </section>

        <aside style="display:grid;gap:var(--s5);align-content:start;min-width:0">
          <section class="card card-pad" id="wallet" aria-labelledby="walletTitle" style="scroll-margin-top:80px">
            <div class="flex items-center justify-between"><h2 class="title" id="walletTitle">Wallet</h2><button type="button" class="link text-sm" id="ledgerBtn">History</button></div>
            <div id="walletBody" style="margin-top:10px"><div class="skeleton sk-title"></div></div>
          </section>
          <section class="card card-pad" id="plans" aria-labelledby="plansTitle" style="scroll-margin-top:80px">
            <h2 class="title" id="plansTitle">Plans</h2>
            <div id="plansBody" style="margin-top:10px"><div class="skeleton sk-title"></div><div class="skeleton sk-line"></div></div>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <dialog class="modal modal-lg" id="dayModal" aria-labelledby="dayTitle">
    <div class="modal-head">
      <div><h2 class="h3" id="dayTitle"></h2><p class="text-sm text-muted" id="daySub" style="margin:4px 0 0"></p></div>
      <button type="button" class="icon-btn" data-close aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="dayBody"></div>
  </dialog>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/maps.js"></script>
  <script src="/js/address.js"></script>
  <script src="/js/wallet.js"></script>
  <script src="/js/review.js"></script>
  <script src="/js/pages/calendar.js"></script>
</body>
</html>
