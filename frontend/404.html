<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · RasoiSe</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
</head>
<body class="page-center">
  <main class="empty-state" style="max-width:420px">
    <p class="logo-text" translate="no">Rasoi<span>Se</span></p>
    <h1>This page isn't on the menu</h1>
    <p>The link may be old or mistyped.</p>
    <a class="btn btn-primary" href="/index.html">Find kitchens near you</a>
    <label class="field-label" for="lang404" style="margin-top:20px">Language</label>
    <select id="lang404" class="select" translate="no" style="max-width:200px;margin:0 auto"></select>
    <script>
      // This page has no header, so it gets its own small language picker
      (function () {
        const sel = document.getElementById('lang404');
        Object.entries(I18n.LANGS).forEach(([code, l]) => sel.add(new Option(l.name, code, false, code === I18n.lang)));
        sel.addEventListener('change', () => I18n.setLang(sel.value));
      })();
    </script>
  </main>
</body>
</html>
