<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin console · RasoiSe</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-theme">
  <main id="main" class="page">
    <div class="container" style="max-width:1320px">
      <div class="admin-layout">
        <nav class="admin-nav" aria-label="Admin sections" id="adminNav">
          <a href="#overview" data-sec="overview"><span class="flex items-center gap-2"><i data-lucide="layout-dashboard" class="icon-sm"></i>Overview</span></a>
          <a href="#approvals" data-sec="approvals"><span class="flex items-center gap-2"><i data-lucide="badge-check" class="icon-sm"></i>Approvals</span><span class="count" data-count="approvals" hidden></span></a>
          <a href="#kitchens" data-sec="kitchens"><span class="flex items-center gap-2"><i data-lucide="store" class="icon-sm"></i>Kitchens</span><span class="count" data-count="flagged" hidden></span></a>
          <a href="#tickets" data-sec="tickets"><span class="flex items-center gap-2"><i data-lucide="life-buoy" class="icon-sm"></i>Complaints</span><span class="count" data-count="tickets" hidden></span></a>
          <a href="#orders" data-sec="orders"><span class="flex items-center gap-2"><i data-lucide="receipt-text" class="icon-sm"></i>Orders</span></a>
          <a href="#users" data-sec="users"><span class="flex items-center gap-2"><i data-lucide="users" class="icon-sm"></i>Users</span></a>
          <a href="#refunds" data-sec="refunds"><span class="flex items-center gap-2"><i data-lucide="wallet" class="icon-sm"></i>Refunds</span></a>
          <a href="#audit" data-sec="audit"><span class="flex items-center gap-2"><i data-lucide="scroll-text" class="icon-sm"></i>Audit log</span></a>
        </nav>
        <div style="min-width:0">
          <div class="admin-mobile-nav" style="margin-bottom:var(--s4)">
            <label class="sr-only" for="secSelect">Section</label>
            <select id="secSelect" class="select">
              <option value="overview">Overview</option><option value="approvals">Approvals</option><option value="kitchens">Kitchens</option>
              <option value="tickets">Complaints</option><option value="orders">Orders</option><option value="users">Users</option>
              <option value="refunds">Refunds</option><option value="audit">Audit log</option>
            </select>
          </div>
          <h1 class="h2" id="secTitle" style="margin-bottom:var(--s4)">Overview</h1>
          <div id="adminRoot" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/tickets.js"></script>
  <script src="/js/pages/admin.js"></script>
</body>
</html>
