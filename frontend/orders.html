<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders · RasoiSe</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main id="main" class="page">
    <div class="container container-narrow">
      <div id="listView">
        <h1 class="h1">Orders</h1>
        <div class="tabs" role="tablist" aria-label="Orders" style="margin:var(--s4) 0 var(--s5)">
          <button type="button" role="tab" class="tab" data-tab="upcoming" aria-selected="true">Upcoming</button>
          <button type="button" role="tab" class="tab" data-tab="past" aria-selected="false">Past</button>
          <button type="button" role="tab" class="tab" data-tab="help" aria-selected="false" id="helpTab">Help & complaints <span class="count" id="helpCount" hidden></span></button>
        </div>
        <div id="listBody" aria-live="polite"></div>
      </div>
      <div id="detailView" hidden></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/maps.js"></script>
  <script src="/js/address.js"></script>
  <script src="/js/wallet.js"></script>
  <script src="/js/review.js"></script>
  <script src="/js/tickets.js"></script>
  <script src="/js/pages/orders.js"></script>
</body>
</html>
